<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="TalCloud en chiffres : 100 % hébergé en France, moins de 15 ms de latence vers Paris, 60 secondes pour déployer, jusqu'à 24 Tb/s de filtrage Anti-DDoS">
  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .sans { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .card { opacity: 0; animation: rise .8s cubic-bezier(.16, 1, .3, 1) forwards; }
    .c2 { animation-delay: .12s; } .c3 { animation-delay: .24s; } .c4 { animation-delay: .36s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; opacity: 1; } }
  </style>

  <g class="card">
    <rect x="1" y="1" width="282" height="188" rx="14" fill="#fffdf8" stroke="#16130e" stroke-opacity=".16"/>
    <path d="M15 2.5h254" stroke="#2b3cff" stroke-width="3" stroke-linecap="round"/>
    <text x="26" y="44" class="serif" font-size="15" font-weight="700" fill="#2b3cff">01</text>
    <text x="26" y="112" class="serif" font-size="58" font-weight="700" letter-spacing="-2" fill="#16130e">100 %</text>
    <text x="26" y="152" class="sans" font-size="17" fill="#4d4639">hébergé en France</text>
  </g>
  <g class="card c2">
    <rect x="307" y="1" width="282" height="188" rx="14" fill="#fffdf8" stroke="#16130e" stroke-opacity=".16"/>
    <path d="M321 2.5h254" stroke="#2b3cff" stroke-width="3" stroke-linecap="round"/>
    <text x="332" y="44" class="serif" font-size="15" font-weight="700" fill="#2b3cff">02</text>
    <text x="332" y="112" class="serif" font-size="58" font-weight="700" letter-spacing="-2" fill="#16130e">&lt; 15 ms</text>
    <text x="332" y="152" class="sans" font-size="17" fill="#4d4639">de latence vers Paris</text>
  </g>
  <g class="card c3">
    <rect x="613" y="1" width="282" height="188" rx="14" fill="#fffdf8" stroke="#16130e" stroke-opacity=".16"/>
    <path d="M627 2.5h254" stroke="#2b3cff" stroke-width="3" stroke-linecap="round"/>
    <text x="638" y="44" class="serif" font-size="15" font-weight="700" fill="#2b3cff">03</text>
    <text x="638" y="112" class="serif" font-size="58" font-weight="700" letter-spacing="-2" fill="#16130e">60 s</text>
    <text x="638" y="152" class="sans" font-size="17" fill="#4d4639">pour déployer un serveur</text>
  </g>
  <g class="card c4">
    <rect x="917" y="1" width="282" height="188" rx="14" fill="#fffdf8" stroke="#16130e" stroke-opacity=".16"/>
    <path d="M931 2.5h254" stroke="#ff5c38" stroke-width="3" stroke-linecap="round"/>
    <text x="942" y="44" class="serif" font-size="15" font-weight="700" fill="#ff5c38">04</text>
    <text x="942" y="112" class="serif" font-size="58" font-weight="700" letter-spacing="-2" fill="#16130e">24 Tb/s</text>
    <text x="942" y="152" class="sans" font-size="17" fill="#4d4639">de filtrage Anti-DDoS</text>
  </g>
</svg>
