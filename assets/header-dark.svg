<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Anthony Donze-Satge — CEO de TalCloud, l'hébergement français qui voit grand">
  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .sans { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.16, 1, .3, 1) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .4s; } .d4 { animation-delay: .6s; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .led { animation: pulse 2.4s ease-in-out infinite; }
    .l2 { animation-delay: .4s; } .l3 { animation-delay: .9s; } .l4 { animation-delay: 1.3s; } .l5 { animation-delay: 1.8s; }
    .act { animation: blink .5s steps(1) infinite; }
    .a2 { animation-duration: .8s; } .a3 { animation-duration: .35s; } .a4 { animation-duration: 1.3s; }
    .flow { stroke-dasharray: 6 10; animation: flow 1.6s linear infinite; }
    .rule { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: draw 1.4s cubic-bezier(.16, 1, .3, 1) .2s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .15; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .rule { animation: none; opacity: 1; stroke-dashoffset: 0; }
      .cursor, .led, .act, .flow { animation: none; }
    }
  </style>

  <rect x=".5" y=".5" width="1199" height="419" rx="22" fill="#16130e" stroke="#faf7f2" stroke-opacity=".16"/>

  <!-- masthead -->
  <text x="50" y="62" class="serif" font-size="26" font-weight="700" fill="#faf7f2" letter-spacing="-.5">Tal<tspan fill="#7c88ff">_</tspan>Cloud<tspan fill="#7c88ff" class="cursor">_</tspan></text>
  <text x="1150" y="60" text-anchor="end" class="sans" font-size="12" font-weight="700" letter-spacing="2.4" fill="#b8b0a0">PARIS — ÉDITION 2026</text>
  <line x1="50" y1="88" x2="1150" y2="88" stroke="#faf7f2" stroke-width="2" class="rule"/>

  <!-- title block -->
  <g class="rise d1">
    <rect x="50" y="122" width="26" height="3" fill="#7c88ff"/>
    <text x="88" y="129" class="sans" font-size="13" font-weight="700" letter-spacing="2.6" fill="#7c88ff">CEO · TALCLOUD</text>
  </g>
  <text x="46" y="222" class="serif rise d2" font-size="92" font-weight="700" letter-spacing="-3.5" fill="#faf7f2">Anthony</text>
  <text x="46" y="312" class="serif rise d3" font-size="92" font-weight="400" font-style="italic" letter-spacing="-3" fill="#ff7a5c">Donze-Satge<tspan fill="#faf7f2" font-style="normal">.</tspan></text>
  <text x="50" y="368" class="sans rise d4" font-size="21" fill="#b8b0a0">L’hébergement français qui voit grand.</text>

  <!-- rack -->
  <g class="rise d4">
    <path d="M990 108 V132" stroke="#7c88ff" stroke-width="2" fill="none" class="flow"/>
    <rect x="850" y="132" width="280" height="244" rx="16" fill="#1f1b15" stroke="#faf7f2" stroke-width="2"/>
    <g fill="#16130e" stroke="#faf7f2" stroke-opacity=".16">
      <rect x="866" y="148" width="248" height="46" rx="8"/>
      <rect x="866" y="204" width="248" height="46" rx="8"/>
      <rect x="866" y="260" width="248" height="46" rx="8"/>
      <rect x="866" y="316" width="248" height="46" rx="8"/>
    </g>
    <!-- drive bays -->
    <g fill="none" stroke="#faf7f2" stroke-opacity=".3" stroke-width="1.5">
      <path d="M960 161v20M972 161v20M984 161v20M996 161v20M1008 161v20M1020 161v20M1032 161v20M1044 161v20"/>
      <path d="M960 217v20M972 217v20M984 217v20M996 217v20M1008 217v20M1020 217v20M1032 217v20M1044 217v20"/>
      <path d="M960 273v20M972 273v20M984 273v20M996 273v20M1008 273v20M1020 273v20M1032 273v20M1044 273v20"/>
      <path d="M960 329v20M972 329v20M984 329v20M996 329v20M1008 329v20M1020 329v20M1032 329v20M1044 329v20"/>
    </g>
    <g class="mono" font-size="11" font-weight="700" fill="#b8b0a0">
      <text x="880" y="175">NVMe</text>
      <text x="880" y="231">XEON</text>
      <text x="880" y="287">ECC</text>
      <text x="880" y="343">DDoS</text>
    </g>
    <!-- status + activity leds -->
    <circle cx="1096" cy="171" r="5" fill="#7c88ff" class="led"/>
    <circle cx="1096" cy="227" r="5" fill="#7c88ff" class="led l2"/>
    <circle cx="1096" cy="283" r="5" fill="#7c88ff" class="led l3"/>
    <circle cx="1096" cy="339" r="5" fill="#ff7a5c" class="led l4"/>
    <rect x="1068" y="168" width="12" height="6" rx="2" fill="#ff7a5c" class="act"/>
    <rect x="1068" y="224" width="12" height="6" rx="2" fill="#ff7a5c" class="act a2"/>
    <rect x="1068" y="280" width="12" height="6" rx="2" fill="#ff7a5c" class="act a3"/>
    <rect x="1068" y="336" width="12" height="6" rx="2" fill="#7c88ff" class="act a4"/>
  </g>
</svg>
